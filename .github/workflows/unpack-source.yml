name: Unpack bootstrap source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.head_commit.message != 'Unpack project source archive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Find and unpack source archive
        run: |
          archive="$(find . -maxdepth 1 -type f -name 'ttowelve-project-*.zip' -print -quit)"
          test -n "$archive"
          unzip -q "$archive" -d .
          rm -f "$archive"
      - name: Commit source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Unpack project source archive'
          git push
